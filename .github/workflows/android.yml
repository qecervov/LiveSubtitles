name: Android

on:
  push:
    branches: ['main']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare pinned native sources
        run: python3 prepare_native.py
      - name: Build and check Android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: bash gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --max-workers=2
      - name: Check source release packaging
        run: python3 scripts/build_release.py --source-only
      - name: Save check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-results
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.*
